<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majestic Poker — Вход</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-icon">♠</div>
      <h1>Majestic Poker</h1>
      <span class="beta-badge">BETA</span>
    </div>
    <p class="auth-subtitle">AI-помощник для покера на Majestic RP</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Вход</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>

    <form id="login-form" class="auth-form active">
      <div class="form-group">
        <label for="login-username">Имя пользователя</label>
        <input type="text" id="login-username" placeholder="artem228" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">Пароль</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="form-error" id="login-error"></div>
      <button type="submit" class="btn btn-primary btn-full">Войти</button>
    </form>

    <form id="register-form" class="auth-form">
      <div class="form-group">
        <label for="reg-username">Имя пользователя</label>
        <input type="text" id="reg-username" placeholder="artem228" required minlength="3" maxlength="20" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="reg-password">Пароль</label>
        <input type="password" id="reg-password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="reg-password2">Повторите пароль</label>
        <input type="password" id="reg-password2" placeholder="••••••••" required autocomplete="new-password">
      </div>
      <div class="form-error" id="register-error"></div>
      <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
    </form>

    <div class="auth-plans">
      <h3>Тарифы</h3>
      <div class="plans-grid">
        <div class="plan-card">
          <div class="plan-name">Free</div>
          <div class="plan-price">0 ₽</div>
          <ul>
            <li>5 анализов в день</li>
            <li>Базовые советы</li>
            <li>История 10 сессий</li>
          </ul>
        </div>
        <div class="plan-card plan-pro">
          <div class="plan-badge">Рекомендуем</div>
          <div class="plan-name">Pro</div>
          <div class="plan-price">299 ₽ <span>/ мес</span></div>
          <ul>
            <li>Безлимитный анализ</li>
            <li>Глубокий AI-совет</li>
            <li>Диапазон противника</li>
            <li>Полная история</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
